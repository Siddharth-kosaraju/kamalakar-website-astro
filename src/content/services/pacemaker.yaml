faq:
  - question: "What is a pacemaker and who needs it?"
    answer: "A pacemaker is a device that helps control abnormal heart rhythms. It is recommended for patients with slow or irregular heartbeats causing symptoms like dizziness, fatigue, or fainting."
  - question: "Is pacemaker implantation safe?"
    answer: "Pacemaker implantation is a commonly performed procedure done under local anaesthesia. Like any procedure it carries risks, including infection, bleeding or bruising, lead displacement and, rarely, lung or blood-vessel injury. Your cardiologist will discuss these with you."
  - question: "How long does recovery take after pacemaker implantation?"
    answer: "Most patients resume normal activities within a few weeks, with precautions such as avoiding heavy lifting on the implant side for the first 4–6 weeks."
  - question: "How long does a pacemaker last?"
    answer: "Pacemakers usually last between 8 to 15 years. Regular check-ups are needed to monitor battery life and performance."
  - question: "Can I use a mobile phone and household appliances with a pacemaker?"
    answer: "Yes. Most household appliances, including microwave ovens, can be used normally. Keep a mobile phone at least 15 cm (6 inches) away from the pacemaker: hold it to the ear on the opposite side and do not carry it in a chest pocket over the device. Tell doctors and airport security staff that you have a pacemaker, and check with your cardiologist before an MRI scan."
