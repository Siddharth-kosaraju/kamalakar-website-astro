sections:
  - paragraphs:
      - "Pacemaker implantation is an established treatment for patients experiencing slow or irregular heartbeats. A pacemaker is a small, battery-operated device placed under the skin near the collarbone that helps regulate the heart's rhythm by sending gentle electrical signals."
      - "Patients with conditions such as bradycardia, heart block, or certain arrhythmias may benefit from this procedure, especially if they experience symptoms like fatigue, dizziness, or fainting."
      - "At Kamalakar Heart Centre in Guntur, patients are evaluated with ECG, Holter monitoring and clinical assessment to decide whether a pacemaker is the appropriate treatment."
  - heading: "The Procedure"
    paragraphs:
      - "Pacemaker implantation is a minimally invasive procedure performed under local anesthesia and typically completed within 1 to 2 hours."
      - "A small incision is made near the collarbone. Thin wires (leads) are guided through a vein into the heart and connected to the pacemaker device, which is placed under the skin. The device is then programmed to suit the patient's specific heart rhythm requirements."
      - "At Kamalakar Heart Centre, the procedure is performed by Dr. Kamalakar Kosaraju, Interventional Cardiologist."
  - heading: "Risks"
    paragraphs:
      - "Pacemaker implantation is a commonly performed procedure done under local anaesthesia. Like any procedure it carries risks, including infection, bleeding or bruising, lead displacement and, rarely, lung or blood-vessel injury. Your cardiologist will discuss these with you."
    bullets:
      - "Infection at the implant site"
      - "Bleeding or bruising around the incision"
      - "Movement of a lead from its position (lead displacement), which may need a repeat procedure"
      - "Rarely, injury to the lung (collapsed lung) or to a blood vessel"
    closingText: "Contact the clinic if you notice fever, increasing pain, redness, swelling or discharge at the implant site, or a return of dizziness or fainting."
  - heading: "Recovery and Aftercare"
    paragraphs:
      - "Most patients stay overnight for observation and return home the next day."
      - "Patients are advised to avoid heavy lifting and excessive arm movement on the side of the implant for about 4 to 6 weeks. After recovery, most individuals can return to their normal lifestyle without significant restrictions."
      - "Pacemaker batteries typically last 8 to 15 years. Regular follow-up visits are needed to check the device and its battery."
      - "At Kamalakar Heart Centre in Guntur, follow-up visits and routine device checks are provided after implantation."
steps:
