  - heading: "What is Heart Failure?"
    paragraphs:
      - "Heart failure is a chronic condition where the heart is unable to pump blood efficiently to meet the body's needs. It does not mean the heart has stopped working, but that it is functioning less effectively."
  - heading: "Common Symptoms of Heart Failure"
    bullets:
      - "Shortness of breath (especially during activity or lying down)"
      - "Fatigue and weakness"
      - "Swelling in legs, ankles, or feet"
      - "Rapid or irregular heartbeat"
      - "Persistent cough or wheezing"
      - "Sudden weight gain due to fluid retention"
      - "Difficulty performing daily activities"
  - heading: "Heart Failure Treatment in Guntur"
    paragraphs:
      - "At Kamalakar Heart Centre, treatment is planned for each patient in three parts:"
  - heading: "1. Diagnosis"
    bullets:
      - "2D Echocardiography (to assess ejection fraction)"
      - "ECG and blood tests"
      - "Identification of underlying causes (CAD, hypertension, valve disease, cardiomyopathy)"
  - heading: "2. Personalized Treatment Plan"
    bullets:
      - "Medications (beta-blockers, ACE inhibitors, diuretics)"
      - "Blood pressure and fluid management"
      - "Risk factor control"
  - heading: "3. Device Therapy and Follow-up (If Required)"
    bullets:
      - "Pacemaker implantation"
      - "Cardiac Resynchronization Therapy (CRT)"
      - "Continuous monitoring and follow-up"
  - heading: "Emergency Response During Cardiac Arrest"
    paragraphs:
      - "If a person suddenly collapses, is unresponsive, and is not breathing normally:"
    bullets:
      - "Call emergency medical services immediately"
      - "Start chest compressions in the center of the chest"
      - "Push hard and fast (100–120 compressions per minute)"
      - "Allow full chest recoil after each compression"
      - "Continue until medical help arrives"
    closingText: "Early CPR can save lives and improve survival chances."
  - heading: "Heart-Healthy Diet & Lifestyle"
    paragraphs:
      - "A healthy lifestyle plays a key role in preventing and managing heart failure."
  - heading: "Foods to Include"
    bullets:
      - "Fresh fruits and vegetables"
      - "Whole grains (oats, brown rice)"
      - "Lean proteins (fish, legumes, nuts)"
      - "Healthy fats (olive oil, seeds)"
      - "Low-fat dairy products"
  - heading: "Foods to Limit"
    bullets:
      - "Excess salt (sodium)"
      - "Processed and packaged foods"
      - "Fried and oily foods"
      - "Sugary drinks"
      - "Red meat (in excess)"
  - heading: "Healthy Habits"
    bullets:
      - "Follow your doctor's advice on salt and fluid intake"
      - "Maintain a healthy weight"
      - "Stay physically active (as advised)"
      - "Avoid smoking and limit alcohol"
      - "Manage stress effectively"
  - heading: "When to Seek Immediate Medical Help"
    bullets:
      - "Sudden severe breathlessness"
      - "Chest pain or pressure"
      - "Fainting or dizziness"
      - "Rapid swelling or sudden weight gain"
      - "Blue lips or fingertips"
      - "Severe fatigue or confusion"
    closingText: "If you or your loved one has any of these symptoms, do not delay medical care. Call emergency services or go to the nearest hospital."
  - heading: "Aims of Heart Failure Management"
    paragraphs:
      - "Results vary from patient to patient. Treatment aims to:"
    bullets:
      - "Improve or stabilise heart function"
      - "Reduce symptoms and hospital visits"
      - "Lower the risk of complications"
      - "Improve quality of life"
  - heading: "Conclusion"
    paragraphs:
      - "Heart failure diagnosis, treatment and long-term follow-up are provided by Dr. Kamalakar Kosaraju at Kamalakar Heart Centre, Guntur."
