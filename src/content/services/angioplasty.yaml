faq:
  - question: "What is an angiogram?"
    answer: "An angiogram is a test that uses contrast dye and X-rays to detect blockages in heart arteries."
  - question: "Is an angiogram done through the wrist or the groin?"
    answer: "An angiogram can be done through the radial artery at the wrist or the femoral artery in the groin. The wrist route generally causes less bleeding at the access site and allows patients to sit up and walk sooner. The groin route may be used when the wrist artery is not suitable. Your cardiologist chooses the route based on your anatomy and condition."
  - question: "How long does an angiogram take?"
    answer: "It usually takes about 30 to 45 minutes."
  - question: "Can angioplasty be done immediately after angiogram?"
    answer: "Yes, angioplasty can be performed in the same session if blockage is found."
  - question: "Will I need medication after angioplasty?"
    answer: "Yes. After a stent is placed, antiplatelet (blood-thinning) medicines are prescribed to reduce the risk of a clot forming in the stent, along with other heart medicines as advised. Do not stop them without consulting your cardiologist."
