sections:
  - paragraphs:
      - "Angiogram and angioplasty are catheter-based heart procedures used to diagnose and treat narrowed or blocked coronary arteries. An angiogram shows where the blockages are; angioplasty opens a blocked artery to restore blood flow to the heart muscle."
      - "At Kamalakar Heart Centre in Guntur, these procedures are performed by Dr. Kamalakar Kosaraju, Interventional Cardiologist, in the cath lab at Life Hospital, Guntur."
  - heading: "What is an Angiogram?"
    paragraphs:
      - "An angiogram (coronary angiography) is a diagnostic procedure used to identify blockages or narrowing in the coronary arteries."
      - "During the procedure:"
    bullets:
      - "A thin catheter is inserted through the wrist or groin"
      - "Contrast dye is injected into the arteries"
      - "X-ray imaging shows real-time blood flow and detects blockages"
    closingText: "The images show whether the coronary arteries are narrowed, where, and by how much, which helps decide the treatment."
  - heading: "What is Angioplasty?"
    paragraphs:
      - "If a blockage is detected, angioplasty (Percutaneous Coronary Intervention) is performed to restore normal blood flow."
    bullets:
      - "A balloon is inflated to open the blocked artery"
      - "A stent is placed to keep the artery open"
      - "The procedure is minimally invasive and performed under local anesthesia"
    closingText: "Recovery is usually shorter than after open-heart surgery. How long you stay in hospital depends on your condition and whether the procedure was planned or done as an emergency."
  - heading: "Angiogram & Angioplasty Services in Guntur"
    paragraphs:
      - "At Kamalakar Heart Centre, we provide:"
    bullets:
      - "Procedures performed by Dr. Kamalakar Kosaraju, Interventional Cardiologist"
      - "Cath-lab facilities at Life Hospital, Guntur"
      - "Benefits, risks and alternatives discussed with each patient before the procedure"
      - "Performed under local anaesthesia"
  - heading: "Who Needs Angiogram or Angioplasty?"
    paragraphs:
      - "Your cardiologist may recommend these procedures if you have:"
    bullets:
      - "Chest pain or discomfort (angina)"
      - "Shortness of breath"
      - "Abnormal ECG or stress test results"
      - "Previous heart attack"
      - "Risk factors such as diabetes, BP, or high cholesterol"
    closingText: "Whether an angiogram is needed is decided after a consultation, based on your symptoms and test results."
  - heading: "Benefits of Angiogram & Angioplasty"
    bullets:
      - "Shows the location and severity of coronary blockages"
      - "Can relieve angina and, in a heart attack, restore blood flow"
      - "Minimally invasive: done through the wrist or groin, without open surgery"
      - "Recovery is usually shorter than after bypass surgery"
  - heading: "Risks and Limitations"
    paragraphs:
      - "Angiogram and angioplasty are commonly performed procedures, but like any procedure they carry risks. Your cardiologist will explain how these apply to you before you give consent. Possible risks include:"
    bullets:
      - "Bleeding or bruising at the wrist or groin access site"
      - "Allergic reaction to the contrast dye"
      - "Effect of the contrast dye on the kidneys, particularly in people with existing kidney disease or diabetes"
      - "Injury to the blood vessel used for access or to the coronary artery"
      - "Irregular heartbeat during the procedure"
      - "Rarely, heart attack or stroke"
      - "A treated artery can narrow again over time (restenosis), and new blockages can form elsewhere"
    closingText: "Not every blockage needs angioplasty. Depending on the angiogram findings, treatment with medicines alone or bypass surgery may be more suitable, and these alternatives are discussed with you. Angioplasty treats a narrowing but does not cure coronary artery disease, so medicines and lifestyle changes remain necessary afterwards."
  - heading: "Conclusion"
    paragraphs:
      - "Angiogram and angioplasty in Guntur are performed by Dr. Kamalakar Kosaraju at Kamalakar Heart Centre, Life Hospital. Call the clinic to arrange a consultation."
