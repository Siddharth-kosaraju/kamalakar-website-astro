description: "Most people only think about seeing a cardiologist once symptoms appear. A routine heart checkup — ECG, 2D Echo, blood pressure, sugar, and cholesterol — while you're still well helps confirm your medications are working, catch side effects early, and often picks up unrelated issues like diabetes or thyroid problems early too."
keyPoints:
  - "A routine checkup confirms whether current medications are working as intended"
  - "Anyone over 30 should have at least one heart checkup a year"
