description: "An ECG only shows the heart's electrical activity — it can look normal even when blockages or other problems exist. Likewise, small changes on an ECG don't always mean serious heart disease. If you have chest pain or breathlessness, further tests like an Echo, TMT, or CT Coronary Angiogram may be needed to get the full picture."
keyPoints:
  - "A normal ECG does not rule out blockages or other heart conditions"
  - "Minor ECG changes don't automatically mean serious heart disease"
  - "Persistent chest pain or breathlessness warrants further testing beyond an ECG"
