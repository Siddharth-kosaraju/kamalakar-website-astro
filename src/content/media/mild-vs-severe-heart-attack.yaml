description: "\"Mild\" and \"severe\" describe how much heart muscle damage has occurred — but every heart attack is a medical emergency that needs immediate attention. Chest pain or pressure, pain spreading to the arm, shoulder, jaw or back, breathlessness, and sudden sweating or dizziness are all warning signs that should never be ignored, however mild they seem at first."
keyPoints:
  - "\"Mild\" vs \"severe\" refers to the extent of heart muscle damage, not urgency — both need immediate care"
  - "Watch for chest pressure, pain radiating to the arm, jaw or back, breathlessness, and sudden sweating"
  - "Early ECG and cardiac evaluation can limit muscle damage and improve outcomes"
