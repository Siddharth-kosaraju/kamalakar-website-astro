description: "Not all heart attacks are the same. An Anterior Wall MI, caused by a blockage in the LAD artery, tends to be the most severe since it affects a large area of the heart muscle. An Inferior Wall MI affects the lower heart wall and often brings nausea and a slow heart rate. A Right Ventricular MI usually occurs alongside an inferior MI and can cause low blood pressure. All three are medical emergencies that need immediate treatment."
keyPoints:
